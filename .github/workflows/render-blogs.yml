name: Render Blog Notebooks

on:
  push:
    branches: [main]
    paths:
      - "blog_notebooks/**/*.ipynb"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Wipe blogs/ for a clean rebuild
        run: rm -rf blogs/*

      - name: Render notebooks to blogs/
        run: |
          set -e
          find blog_notebooks -type f -name '*.ipynb' ! -name '_template.ipynb' \
              -not -path '*/.ipynb_checkpoints/*' -print0 |
            while IFS= read -r -d '' nb; do
              echo "Rendering $nb"
              bash scripts/render-blog.sh "$nb"
            done

      - name: Prune _blogs entries whose source notebook is gone
        run: python3 scripts/prune_orphaned_blogs.py

      - name: Commit rendered output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blogs blog_notebooks _blogs
          git diff --cached --quiet || git commit -m "Auto-render blog notebooks [skip ci]"
          git push
