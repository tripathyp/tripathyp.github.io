<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10;url=https://edge.geog.ucsb.edu">
<link rel="canonical" href="https://edge.geog.ucsb.edu">
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, ".SFNSText-Regular", "San Francisco", "Roboto",
      "Segoe UI", "Helvetica Neue", "Lucida Grande", Arial, sans-serif;
    background-color: #fff;
    color: #303336;
    text-align: center;
    padding: 2em;
    box-sizing: border-box;
  }
  .redirect-message {
    font-size: 1.8em;
    line-height: 1.5;
    max-width: 600px;
  }
  .redirect-message a {
    color: #0288d1;
    text-decoration: underline;
  }
  .redirect-count {
    font-weight: 600;
    color: #0288d1;
  }
  .redirect-note {
    font-size: 0.5em;
    line-height: 1.5;
    color: #767a7d;
    margin-top: 1.2em;
  }
  @media screen and (max-width: 600px) {
    .redirect-message {
      font-size: 1.3em;
    }
  }
</style>
</head>
<body>
  <p class="redirect-message">
    You will be redirected to the preprint within<br>
    <span class="redirect-count" id="redirect-count">10</span> seconds.<br>
    If not, <a href="https://edge.geog.ucsb.edu">click here</a>.
    <br>
    <span class="redirect-note">This is an early version of the preprint and may contain minor inaccuracies.</span>
  </p>
  <script>
    /* mirrors the meta-refresh above; purely visual, the meta tag still does the actual redirect */
    (function () {
      var secondsLeft = 10;
      var countEl = document.getElementById("redirect-count");
      var timer = setInterval(function () {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          clearInterval(timer);
          return;
        }
        countEl.textContent = secondsLeft;
      }, 1000);
    })();
  </script>
</body>
</html>
